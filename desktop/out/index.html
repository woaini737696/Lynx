<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynx</title>
  <style>
    /* ============ 主题变量 ============ */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f7f8;
      --text-primary: #0a0f1a;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --primary: #0F62FE;
      --primary-light: rgba(15, 98, 254, 0.12);
      --primary-glow: rgba(15, 98, 254, 0.35);
      --border: #e5e7eb;
      --success: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #03060a;
        --bg-secondary: #0a0f18;
        --bg-tertiary: #111827;
        --text-primary: #f5f7ff;
        --text-secondary: #94a3b8;
        --text-tertiary: #64748b;
        --primary: #3b82f6;
        --primary-light: rgba(59, 130, 246, 0.15);
        --primary-glow: rgba(59, 130, 246, 0.5);
        --border: #1f2937;
      }
    }

    [data-theme="dark"] {
      --bg-primary: #03060a;
      --bg-secondary: #0a0f18;
      --bg-tertiary: #111827;
      --text-primary: #f5f7ff;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --primary: #3b82f6;
      --primary-light: rgba(59, 130, 246, 0.15);
      --primary-glow: rgba(59, 130, 246, 0.5);
      --border: #1f2937;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 主题切换 */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      background: hsl(var(--bg-secondary) / 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .theme-btn.active {
      background: var(--primary);
      color: white;
    }

    /* 启动容器 */
    .launch-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 320px;
      padding: 24px;
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: white;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 8px 32px -8px var(--primary-glow),
        0 0 48px -12px var(--primary-glow);
      animation: logo-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 50%);
      pointer-events: none;
    }

    @keyframes logo-in {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .brand-text {
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* 骨架屏 */
    .skeleton-card {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(
        90deg,
        var(--bg-tertiary, #e5e7eb) 25%,
        rgba(148, 163, 184, 0.25) 50%,
        var(--bg-tertiary, #e5e7eb) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .skeleton-line.short { width: 60%; }
    .skeleton-line.medium { width: 80%; }
    .skeleton-line.long { width: 100%; }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* 加载指示 */
    .loading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 隐藏的帮助入口 */
    .help-link {
      font-size: 12px;
      color: var(--text-tertiary);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    .help-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <!-- 主题切换 -->
  <div class="theme-toggle">
    <button class="theme-btn" data-theme-btn="light" title="浅色">☀️</button>
    <button class="theme-btn" data-theme-btn="dark" title="深色">🌙</button>
    <button class="theme-btn active" data-theme-btn="system" title="自适应">🖥️</button>
  </div>

  <!-- 启动画面 -->
  <div class="launch-container">
    <div class="logo-wrap">X</div>
    <div class="brand-text">
      <div class="brand-title">Lynx</div>
      <div class="brand-subtitle">Lynx AI 工作台，不用学，直接干</div>
    </div>

    <!-- 骨架屏 -->
    <div class="skeleton-card">
      <div class="skeleton-line long"></div>
      <div class="skeleton-line medium"></div>
      <div class="skeleton-line short"></div>
      <div class="skeleton-line long"></div>
    </div>

    <!-- 加载状态 -->
    <div class="loading-row">
      <span class="spinner"></span>
      <span id="loading-text">正在启动 Lynx...</span>
    </div>
  </div>

  <script>
    // ============ Tauri 2.x API 兼容封装 ============
    function getTauriInvoke() {
      const t = window.__TAURI__;
      if (!t) return null;
      if (t.core && typeof t.core.invoke === 'function') return t.core.invoke;
      if (typeof t.invoke === 'function') return t.invoke;
      return null;
    }

    async function tauriInvoke(cmd, args) {
      const fn = getTauriInvoke();
      if (!fn) throw new Error('Tauri invoke 不可用');
      return fn(cmd, args);
    }

    // ============ 主题管理 ============
    const THEME_KEY = 'lynnhub-theme';
    const savedTheme = localStorage.getItem(THEME_KEY) || 'system';

    function applyTheme(theme) {
      if (theme === 'system') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      document.querySelectorAll('[data-theme-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeBtn === theme);
      });
      localStorage.setItem(THEME_KEY, theme);
    }

    applyTheme(savedTheme);

    document.querySelectorAll('[data-theme-btn]').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.themeBtn));
    });

    // ============ 加载文案 ============
    const loadingTexts = [
      '正在启动 Lynx...',
      '正在准备 AI 工作空间...',
      '正在加载界面...',
    ];
    let textIndex = 0;
    const loadingTextEl = document.getElementById('loading-text');
    const textInterval = setInterval(() => {
      textIndex = (textIndex + 1) % loadingTexts.length;
      loadingTextEl.textContent = loadingTexts[textIndex];
    }, 2500);

    // ============ 服务器连接检测 ============
    const SERVER_URL = 'http://localhost:5176';
    const SERVER_HOST = 'localhost';
    const SERVER_PORT = 5176;
    let retryCount = 0;
    const MAX_RETRY_INTERVAL = 8000;

    async function checkServer() {
      const invoke = getTauriInvoke();
      if (!invoke) {
        loadingTextEl.textContent = '本地运行环境未就绪';
        return false;
      }

      try {
        const online = await invoke('check_local_server', {
          host: SERVER_HOST,
          port: SERVER_PORT,
        });

        if (online) {
          loadingTextEl.textContent = '即将进入 Lynx...';
          clearInterval(textInterval);
          setTimeout(() => {
            invoke('navigate_to_url', { url: SERVER_URL })
              .catch(() => { window.location.href = SERVER_URL; });
          }, 400);
          return true;
        }
      } catch {
        // 静默重试
      }
      return false;
    }

    async function autoRetry() {
      const connected = await checkServer();
      if (!connected) {
        retryCount++;
        const delay = Math.min(800 + retryCount * 400, MAX_RETRY_INTERVAL);
        setTimeout(autoRetry, delay);
      }
    }

    // ============ 启动 ============
    autoRetry();
  </script>
</body>
</html>
