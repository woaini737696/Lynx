name: Build Windows Desktop Installer (Electron)

# 在 GitHub 提供的 Windows runner 上构建 Electron NSIS exe 安装包
# 构建后上传到 GitHub Release（存放）+ 部署到阿里云服务器 /opt/lynx/downloads/（下载）
# 官网"下载桌面版"指向服务器：https://www.lynxdo.com/download/Lynx-windows-setup.exe
# 触发方式：
#   1. 手动触发（workflow_dispatch）
#   2. 推送 v*-desktop 标签自动触发

on:
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: '是否部署安装包到阿里云服务器（/opt/lynx/downloads/）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*-desktop'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Electron NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop-electron/package.json

      - name: Install dependencies
        working-directory: desktop-electron
        run: npm install

      - name: Build NSIS installer
        working-directory: desktop-electron
        run: npm run build:win

      - name: Rename installer to fixed name
        # 重命名为固定文件名，配合 https://www.lynxdo.com/download/Lynx-windows-setup.exe 永久下载
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop-electron/dist/*.exe -ErrorAction Stop | Where-Object { $_.Name -notlike "*blockmap*" } | Select-Object -First 1
          Write-Host "Original installer: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          $fixed = Join-Path $exe.DirectoryName "Lynx-windows-setup.exe"
          Copy-Item $exe.FullName -Destination $fixed -Force
          Write-Host "Fixed-name installer: $fixed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lynx-windows-setup
          path: desktop-electron/dist/Lynx-windows-setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (存放用)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lynx Desktop ${{ github.ref_name }}
          files: desktop-electron/dist/Lynx-windows-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy installer to server
        # 部署到阿里云服务器 /opt/lynx/downloads/ 供官网下载
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_server)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: desktop-electron/dist/Lynx-windows-setup.exe
          target: /opt/lynx/downloads/

      - name: Verify server download
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_server)
        run: |
          sleep 5
          echo "=== 验证服务器下载链接 ==="
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -I https://www.lynxdo.com/download/Lynx-windows-setup.exe)
          echo "HTTP status: $CODE"
          if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
            echo "✓ 服务器下载链接可用"
          else
            echo "✗ 服务器下载链接不可用 (HTTP $CODE)"
          fi
