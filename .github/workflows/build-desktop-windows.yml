name: Build Windows Desktop Installer

# 在 GitHub 提供的 Windows runner 上构建 NSIS exe 安装包
# 不占用开发服务器（2核2G）任何资源，完全在 GitHub Actions 上执行
# 触发方式：
#   1. 手动触发（workflow_dispatch）
#   2. 推送 v* 标签自动触发（同时创建 Release）

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否同时创建 GitHub Release（发布到 Releases 页面）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# contents: write 允许 GITHUB_TOKEN 创建 Release 和上传 asset
permissions:
  contents: write

jobs:
  build-windows-nsis:
    name: Build Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop-native/native-ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-native/src-tauri

      - name: Install desktop-native dependencies
        working-directory: desktop-native
        run: npm ci

      - name: Install native-ui dependencies
        working-directory: desktop-native/native-ui
        run: npm ci

      - name: Build Tauri NSIS installer
        working-directory: desktop-native
        # --bundles nsis 强制只构建 NSIS，避免 deb/appimage 在 Windows 上失败
        # certificateThumbprint 找不到证书时会自动跳过签名（warning 不报错）
        run: npx tauri build --bundles nsis

      - name: Rename installer to fixed name
        # 重命名为固定文件名，配合 releases/latest/download/ 实现永久下载链接
        # 官网"下载桌面版"按钮指向 latest/download/Lynx-windows-setup.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop-native/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction Stop | Select-Object -First 1
          Write-Host "Original installer: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          $fixed = Join-Path $exe.DirectoryName "Lynx-windows-setup.exe"
          Copy-Item $exe.FullName -Destination $fixed -Force
          Write-Host "Fixed-name installer: $fixed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lynx-windows-setup
          path: desktop-native/src-tauri/target/release/bundle/nsis/Lynx-windows-setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('desktop-{0}', github.run_number) }}
          name: Lynx Desktop ${{ github.ref_name || github.run_number }}
          files: desktop-native/src-tauri/target/release/bundle/nsis/Lynx-windows-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
