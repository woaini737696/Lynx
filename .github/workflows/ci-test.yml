# QA 测试流程 CI 工作流
#
# 触发：每次 PR 到 main / push 到 main / 手动触发
# 流程：lint → unit test → e2e test → 上传覆盖率与 E2E 报告
#
# 失败的 PR 不能合并（需在 GitHub Branch Protection 中启用 "Require status checks to pass"）
#
# 本地复现：
#   npm run lint
#   npm run test
#   npm run test:coverage
#   npm run test:e2e
name: CI Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR 重复 push 时取消旧的运行，节省 CI 资源
concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-test:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-unit # 单元测试通过后再跑 E2E，节省 CI 资源
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma generate
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup test database (SQLite)
        env:
          DATABASE_URL: "file:./test-e2e.db"
          AUTH_SECRET: "ci-test-secret-not-for-production-0123456789abcdef"
          TEST_ADMIN_PASSWORD: "admin123"
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts || true

      - name: Run E2E tests
        env:
          DATABASE_URL: "file:./test-e2e.db"
          AUTH_SECRET: "ci-test-secret-not-for-production-0123456789abcdef"
          TEST_ADMIN_PASSWORD: "admin123"
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
