[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.18.0"
description = "Lynx HermesAgent - 本地 AI 代理框架，支持桌面控制、Shell 命令、浏览器自动化与技能自学习"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lynn" }]
keywords = ["ai", "agent", "automation", "llm", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# 仅依赖标准库，确保安装零依赖、最可靠
dependencies = []

[project.scripts]
hermes = "hermes_agent.cli:main"

[project.urls]
Homepage = "https://github.com/LynnHub/hermes-agent"
Repository = "https://github.com/LynnHub/hermes-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_agent*"]

[tool.setuptools.package-data]
hermes_agent = ["*.py"]
