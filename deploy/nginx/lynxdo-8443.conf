# Lynx Nginx 8443 端口配置 - 绕过大陆运营商对未备案域名 443 端口的 SSL 阻断
# 部署位置：追加到 /etc/nginx/sites-available/lynxdo 末尾
# 作用：让桌面端通过 https://ai.lynxdo.com:8443 访问，避开 443 端口封锁
# 前置：阿里云安全组需开放 TCP 8443 入方向（源 0.0.0.0/0）

# ============ ai.lynxdo.com:8443 ============

server {
    listen 8443 ssl http2;
    server_name ai.lynxdo.com;

    # 证书：复用 www.lynxdo.com 的证书（certbot 申请时已包含 ai.lynxdo.com）
    ssl_certificate /etc/letsencrypt/live/www.lynxdo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lynxdo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传大小限制
    client_max_body_size 20M;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Next.js 静态资源（长缓存）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5176;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # public 静态资源直接服务
    location ~* ^/(lynx-logo-|lynx-icon-|manifest\.webmanifest|sw\.js|ui-preview) {
        root /opt/lynx/app/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /uploads/ {
        alias /opt/lynx/app/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /avatars/ {
        alias /opt/lynx/app/public/avatars/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API + 页面（反向代理到 Next.js）
    location / {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # WebSocket 支持
        proxy_buffering off;
    }
}
