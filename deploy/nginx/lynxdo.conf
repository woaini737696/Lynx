# Lynx Nginx 配置 - 阿里云 ECS 2C2G
# 部署位置：/etc/nginx/sites-available/lynxdo

# ============ HTTP → HTTPS 重定向 ============

server {
    listen 80;
    server_name www.lynxdo.com lynxdo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name ai.lynxdo.com;
    return 301 https://$host$request_uri;
}

# ============ 官网 www.lynxdo.com ============

server {
    listen 443 ssl http2;
    server_name www.lynxdo.com lynxdo.com;

    ssl_certificate /etc/letsencrypt/live/www.lynxdo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lynxdo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/lynx/website;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # 安装包下载
    location /download {
        alias /opt/lynx/downloads;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ============ 应用 ai.lynxdo.com ============

server {
    listen 443 ssl http2;
    server_name ai.lynxdo.com;

    # 证书：certbot 申请时三个域名共用 www.lynxdo.com 的证书
    ssl_certificate /etc/letsencrypt/live/www.lynxdo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lynxdo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：强制 HTTPS（1 年，含子域名）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 权限策略：禁用不需要的浏览器 API
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP：仅允许同源 + 必要的外部资源（OpenAI/MiMo API、飞书、WebSocket）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob: https:; frame-ancestors 'self';" always;

    # 上传大小限制（头像/附件）
    client_max_body_size 20M;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Next.js 静态资源（长缓存）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5176;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============ public 静态资源由 Nginx 直接服务 ============
    # 修复 Next.js standalone 模式下 public 目录文件 404 的问题
    # 直接从 /opt/lynx/app/public/ 提供，避免代理回 Next.js
    location ~* ^/(lynx-logo-|lynx-icon-|manifest\.webmanifest|sw\.js|ui-preview) {
        root /opt/lynx/app/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 用户上传的文件
    location /uploads/ {
        alias /opt/lynx/app/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 头像
    location /avatars/ {
        alias /opt/lynx/app/public/avatars/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 公共资源（其他静态文件兜底）
    location /public/ {
        alias /opt/lynx/app/public/;
    }

    # 安装包下载（与应用共享）
    location /download {
        alias /opt/lynx/downloads;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # WebSocket 网关（桌面端远程操控）—— 必须在 location / 之前，优先匹配
    # 转发到 ws-gateway 进程（PM2 lynx-ws-gateway，端口 3001）
    location /api/ws/agent {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API + 页面（反向代理到 Next.js）
    location / {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # WebSocket 支持（ws-gateway）
        proxy_buffering off;
    }
}
